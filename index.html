<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya Bhai - Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #080314;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.8); }
            100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        }

        .floating-avatar {
            animation: float 4s ease-in-out infinite;
        }

        .glow-btn {
            animation: pulseGlow 2s infinite;
            transition: transform 0.1s ease;
        }

        .glow-btn:active {
            transform: scale(0.96);
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Top Banner -->
    <div class="fade-in" style="background: linear-gradient(90deg, #f59e0b, #d97706); color: #000; width: 100%; max-width: 380px; text-align: center; padding: 10px; border-radius: 9999px; font-weight: 700; font-size: 11px; letter-spacing: 0.5px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);">
        PREDICTIONS ACTIVE · INDIA'S #1 COLOR MASTER
    </div>

    <!-- Avatar Image Box -->
    <div class="floating-avatar fade-in" style="width: 280px; height: 280px; border-radius: 24px; background: linear-gradient(135deg, #f59e0b, #7c3aed, #ec4899); padding: 2px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(124, 58, 237, 0.4);">
        <div style="width: 100%; height: 100%; background-color: #130b2b; border-radius: 22px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
            <img src="Download/surya.jpg" alt="Surya Bhai" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
    </div>

    <!-- Subtitle Badge -->
    <div class="fade-in" style="border: 1px solid rgba(245, 158, 11, 0.4); background-color: rgba(245, 158, 11, 0.05); padding: 6px 16px; border-radius: 9999px; display: flex; align-items: center; gap: 6px; margin-bottom: 16px;">
        <span>👑</span>
        <span style="color: #fcd34d; font-size: 11px; font-weight: 600; letter-spacing: 1px;">KING OF PREDICTION</span>
    </div>

    <!-- Main Heading -->
    <div class="fade-in" style="text-align: center; margin-bottom: 24px;">
        <h1 style="color: #fbbf24; font-size: 32px; font-weight: 900; line-height: 1.2; margin: 0; text-shadow: 0 4px 20px rgba(251, 191, 36, 0.4);">
            Surya Bhai<br>Number Sureshot
        </h1>
        <p style="color: #9ca3af; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; margin-top: 8px;">
            PREMIUM COLOR ANALYSIS
        </p>
    </div>

    <!-- Action Button -->
    <a href="#" id="actionBtn" class="glow-btn fade-in" style="width: 100%; max-width: 380px; background: linear-gradient(90deg, #fbbf24, #d97706); color: #000; text-decoration: none; padding: 16px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 14px;">
        <span style="font-size: 18px;">✈️</span>
        <span id="btnText">SEND MESSAGE</span>
    </a>

    <!-- Footer Timer Display -->
    <div class="fade-in" style="display: flex; align-items: center; gap: 6px; color: #9ca3af; font-size: 11px; margin-top: 16px;">
        <span>⏱️</span>
        <span id="timerText">Redirecting to Telegram in 00:15</span>
    </div>

    <!-- Bottom Stats Cards -->
    <div class="fade-in" style="width: 100%; max-width: 380px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px;">
        <div style="background-color: #130b2b; border: 1px solid rgba(124, 58, 237, 0.3); padding: 12px 8px; border-radius: 12px; text-align: center;">
            <div style="font-size: 16px; margin-bottom: 4px;">🎯</div>
            <div style="color: #ec4899; font-weight: 700; font-size: 13px;">1-2 Level</div>
            <div style="color: #9ca3af; font-size: 9px; text-transform: uppercase; margin-top: 2px;">WIN RATE</div>
        </div>
        <div style="background-color: #130b2b; border: 1px solid rgba(124, 58, 237, 0.3); padding: 12px 8px; border-radius: 12px; text-align: center;">
            <div style="font-size: 16px; margin-bottom: 4px;">⚡</div>
            <div style="color: #fbbf24; font-weight: 700; font-size: 13px;">99.9%</div>
            <div style="color: #9ca3af; font-size: 9px; text-transform: uppercase; margin-top: 2px;">ACCURACY</div>
        </div>
        <div style="background-color: #130b2b; border: 1px solid rgba(124, 58, 237, 0.3); padding: 12px 8px; border-radius: 12px; text-align: center;">
            <div style="font-size: 16px; margin-bottom: 4px;">👥</div>
            <div style="color: #22d3ee; font-weight: 700; font-size: 13px;">VIP</div>
            <div style="color: #9ca3af; font-size: 9px; text-transform: uppercase; margin-top: 2px;">MEMBERS</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const actionBtn = document.getElementById('actionBtn');
            const timerText = document.getElementById('timerText');
            const btnText = document.getElementById('btnText');
            let timerStarted = false;

            actionBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (timerStarted) return;
                timerStarted = true;

                let timeLeft = 15;
                btnText.innerText = "PLEASE WAIT...";
                
                const timerInterval = setInterval(() => {
                    let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                    timerText.innerText = `Redirecting to Telegram in 00:${seconds}`;
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        window.location.href = "https://t.me/+cnd47t4x819iOGY1";
                    }
                    timeLeft--;
                }, 1000);
            });
        });
    </script>

</body>
</html>
